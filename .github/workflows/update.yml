name: Update data iklim

on:
  schedule:
    - cron: '0 3 * * *'    # Dijalankan otomatis tiap hari pukul 03:00 UTC
  workflow_dispatch:        # Bisa dijalankan manual via tab Actions di GitHub
  push:
    paths:
      - 'build_data.py'
      - 'process_enso.py'
      - 'process_iod.py'
      - '.github/workflows/update.yml'
      - 'Data_Curah_Hujan_*.xlsx'

permissions:
  contents: write

# Hanya satu run pada satu waktu, supaya tidak saling tabrak saat push
concurrency:
  group: update-climate-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy openpyxl requests pandas

      # Indeks BoM untuk halaman web. Kalau BoM sedang gangguan, langkah ini
      # tidak menggagalkan job: data.json tetap dibuat dan halaman memakai
      # indeks bawaan data.json.
      - name: Run ENSO processing script (BoM Niño 3.4)
        continue-on-error: true
        run: python process_enso.py

      - name: Run IOD processing script (BoM DMI)
        continue-on-error: true
        run: python process_iod.py

      - name: Run build script
        run: python build_data.py
        env:
          SHEET_XLSX_URL: ${{ secrets.SHEET_XLSX_URL }}

      - name: Commit and push changes
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage file satu per satu: bila satu path tidak ada, yang lain tetap ter-stage
          for f in data.json cache nino34_bom_oni_format.csv iod_bom_dmi_format.csv; do
            [ -e "$f" ] && git add "$f"
          done

          if git diff --staged --quiet; then
            echo "Tidak ada perubahan data baru untuk di-commit."
            exit 0
          fi

          # File Excel ikut di-commit hanya bila data berubah (openpyxl menulis
          # waktu pembuatan, jadi file .xlsx selalu "berbeda" tiap run)
          for f in nino34_bom_oni_format.xlsx iod_bom_dmi_format.xlsx; do
            [ -e "$f" ] && git add "$f"
          done

          git commit -m "Update data iklim otomatis $(date -u +'%Y-%m-%d %H:%M UTC')"

          # Ambil commit terbaru dulu lalu push; ulangi bila ada yang menyela
          pushed=0
          for i in 1 2 3; do
            if git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              pushed=1
              break
            fi
            echo "Push gagal (percobaan $i), mencoba lagi..."
            sleep 5
          done
          [ "$pushed" = "1" ] || { echo "Push gagal setelah 3 percobaan."; exit 1; }
